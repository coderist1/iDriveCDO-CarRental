<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My trips — iDrive Driver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css?v=16">
</head>
<body data-page="driverHome" data-auth="driver" data-base="../">
  <div id="app-nav"></div>
  <div class="admin-shell driver-shell">
    <section id="driver-desk">
      <div class="desk-hero">
        <div>
          <p class="eyebrow">Driver workspace</p>
          <h1>My trips</h1>
          <p id="driver-greeting">View assigned trips and update trip and fuel status.</p>
        </div>
        <div class="desk-hero-actions" id="driver-identity"></div>
      </div>

      <p id="status-pills" class="status-pills driver-duty-pills" aria-label="Duty status"></p>

      <div id="driver-stats" class="fleet-stats driver-stats"></div>

      <div class="fleet-list-head">
        <h2>Trip queue</h2>
        <div class="desk-toolbar">
          <select id="driver-filter" class="form-select" aria-label="Filter trips">
            <option value="active">Active &amp; upcoming</option>
            <option value="ongoing">Ongoing only</option>
            <option value="completed">Completed</option>
            <option value="all">All trips</option>
          </select>
        </div>
      </div>

      <div id="driver-active" class="driver-section"></div>
      <div id="driver-history" class="driver-section"></div>
    </section>
  </div>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js"></script>
  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/validation.js"></script>
  <script src="../shared/js/routes.js?v=16"></script>
  <script src="../shared/js/domain.js?v=16"></script>
  <script src="../auth/auth.js?v=16"></script>
  <script src="../shared/js/ui.js?v=16"></script>
  <script src="./driver.js?v=16"></script>
  <script src="../shared/js/app.js"></script>
</body>
</html>
