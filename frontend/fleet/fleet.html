<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet — iDrive CDO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css">
</head>
<body data-page="fleet" data-auth="public" data-base="../">
  <div id="app-nav"></div>
  <section class="section">
    <p class="eyebrow">Inventory</p>
    <h1>Every plate we will hand you this week</h1>
    <div class="filters">
      <select id="filter-type" class="form-select">
        <option value="">All types</option>
        <option>Sedan</option>
        <option>SUV</option>
        <option>Van</option>
        <option>Pickup</option>
      </select>
      <select id="filter-trans" class="form-select">
        <option value="">Any transmission</option>
        <option>Automatic</option>
        <option>Manual</option>
      </select>
      <select id="filter-sort" class="form-select">
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="seats">Most seats</option>
      </select>
    </div>
    <div id="fleet-grid" class="card-grid"></div>
    <p id="fleet-empty" class="notice" hidden>No cars match those filters.</p>
  </section>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js"></script>
  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/validation.js"></script>
  <script src="../shared/js/routes.js"></script>
  <script src="../shared/js/domain.js"></script>
  <script src="../auth/auth.js"></script>
  <script src="../shared/js/ui.js"></script>
  <script src="./fleet.js"></script>
  <script src="../shared/js/app.js"></script>
</body>
</html>
