<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Available cars â€?iDrive CDO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css?v=28">
</head>
<body data-page="fleet" data-auth="public" data-base="../">
  <div id="app-nav"></div>
  <section class="section">
    <p class="eyebrow">Available cars</p>
    <h1>Choose a vehicle you can book</h1>
    <p id="fleet-summary" class="fleet-summary">Loading available carsâ€?/p>
    <div class="filters">
      <label class="field">
        Pickup date
        <input id="filter-start" class="form-control" type="date">
      </label>
      <label class="field">
        Return date
        <input id="filter-end" class="form-control" type="date">
      </label>
      <select id="filter-type" class="form-select">
        <option value="">All types</option>
        <option>Sedan</option>
        <option>SUV</option>
        <option>Van</option>
        <option>Pickup</option>
      </select>
      <select id="filter-trans" class="form-select">
        <option value="">Any transmission</option>
        <option>Automatic</option>
        <option>Manual</option>
      </select>
      <select id="filter-sort" class="form-select">
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="seats">Most seats</option>
      </select>
    </div>
    <div id="fleet-grid" class="card-grid"></div>
    <p id="fleet-empty" class="notice" hidden>No cars available for those dates or filters.</p>
  </section>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js"></script>
  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/validation.js"></script>
  <script src="../shared/js/routes.js"></script>
  <script src="../shared/js/domain.js?v=9"></script>
  <script src="../auth/auth.js"></script>
  <script src="../shared/js/ui.js?v=24"></script>
  <script src="./fleet.js?v=9"></script>
  <script src="../shared/js/app.js"></script>
</body>
</html>
