<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments - iDrive CDO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css?v=20261010g">
</head>
<body data-page="adminPayments" data-auth="staff" data-base="../">
  <div id="app-nav"></div>
  <div class="admin-shell">
    <div id="admin-side"></div>
    <section>
      <div class="desk-hero">
        <div>
          <p class="eyebrow">Payments</p>
          <h1>Payments</h1>
          <p>Rental fees, payment details, and payment status for every booking.</p>
        </div>
      </div>
      <form id="payment-form" class="form-card" novalidate>
        <h3>Record payment</h3>
        <div class="row g-2">
          <div class="col-md-6"><label class="field">Booking <select class="form-select" name="bookingId" required></select></label></div>
          <div class="col-md-3"><label class="field">Amount (₱) <input class="form-control" name="amount" type="number" min="1" step="0.01" required></label></div>
          <div class="col-md-3"><label class="field">Payment date <input class="form-control" name="paymentDate" type="date" required></label></div>
          <div class="col-md-3"><label class="field">Method <select class="form-select" name="method">
            <option value="cash">Cash</option>
            <option value="cashless">Cashless wallet</option>
            <option value="card">Card</option>
          </select></label></div>
          <div class="col-md-3"><label class="field">Brand / wallet <select class="form-select" name="brand"></select></label></div>
          <div class="col-md-3"><label class="field">Last 4 digits <input class="form-control" name="last4" inputmode="numeric" maxlength="4" placeholder="Card or wallet"></label></div>
          <div class="col-md-3"><label class="field">Status <select class="form-select" name="status">
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
            <option value="failed">Failed</option>
            <option value="refunded">Refunded</option>
          </select></label></div>
          <div class="col-md-6"><label class="field">Payer name <input class="form-control" name="holder" maxlength="80"></label></div>
          <div class="col-md-6"><label class="field">Reference / OR no. <input class="form-control" name="referenceNumber" maxlength="40" placeholder="Auto-generated if blank"></label></div>
        </div>
        <p id="payment-fee" class="fineprint"></p>
        <button class="btn btn-gold" type="submit">Save payment</button>
      </form>
      <div id="payments-list" class="panel"></div>
    </section>
  </div>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js?v=20261005a"></script>
  <script src="../shared/js/store.js?v=20261008h"></script>
  <script src="../shared/js/api.js?v=20261009g"></script>
  <script src="../shared/js/validation.js?v=20261005a"></script>
  <script src="../shared/js/routes.js?v=20261005a"></script>
  <script src="../shared/js/domain.js?v=20261010h"></script>
  <script src="../auth/auth.js?v=20261010a"></script>
  <script src="../shared/js/ui.js?v=20261010b"></script>
  <script src="./admin.js?v=20261010a"></script>
  <script src="../shared/js/app.js?v=20261008h"></script>
</body>
</html>
