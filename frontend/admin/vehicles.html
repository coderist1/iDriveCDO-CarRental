<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet desk — iDrive CDO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css">
</head>
<body data-page="adminVehicles" data-auth="staff" data-base="../">
  <div id="app-nav"></div>
  <div class="admin-shell">
    <div id="admin-side"></div>
    <section id="vehicle-desk">
      <p class="eyebrow">Inventory</p>
      <h1>Fleet desk</h1>
      <form id="vehicle-form" class="form-card">
        <input type="hidden" name="vehicleId">
        <div class="row g-2">
          <div class="col-md-6"><label class="field">Display name <input class="form-control" name="name" required></label></div>
          <div class="col-md-3"><label class="field">Brand <input class="form-control" name="brand" required></label></div>
          <div class="col-md-3"><label class="field">Model <input class="form-control" name="model" required></label></div>
        </div>
        <div class="row g-2">
          <div class="col-md-2"><label class="field">Year <input class="form-control" name="year" type="number"></label></div>
          <div class="col-md-2"><label class="field">Type
            <select class="form-select" name="type"><option>Sedan</option><option>SUV</option><option>Van</option><option>Pickup</option></select>
          </label></div>
          <div class="col-md-2"><label class="field">Gear
            <select class="form-select" name="transmission"><option>Automatic</option><option>Manual</option></select>
          </label></div>
          <div class="col-md-2"><label class="field">Fuel
            <select class="form-select" name="fuel"><option>Gasoline</option><option>Diesel</option></select>
          </label></div>
          <div class="col-md-2"><label class="field">Seats <input class="form-control" name="seats" type="number"></label></div>
          <div class="col-md-2"><label class="field">Bags <input class="form-control" name="luggage" type="number"></label></div>
        </div>
        <div class="row g-2">
          <div class="col-md-3"><label class="field">Daily rate <input class="form-control" name="dailyRate" type="number" required></label></div>
          <div class="col-md-3"><label class="field">Plate <input class="form-control" name="plate" required></label></div>
          <div class="col-md-3"><label class="field">Status
            <select class="form-select" name="status"><option value="available">available</option><option value="maintenance">maintenance</option></select>
          </label></div>
          <div class="col-md-3"><label class="field">Image URL <input class="form-control" name="image"></label></div>
        </div>
        <label class="field">Features (comma separated) <input class="form-control" name="features"></label>
        <label class="field">Description <textarea class="form-control" name="description"></textarea></label>
        <button class="btn btn-gold" type="submit">Save vehicle</button>
      </form>
      <table class="table">
        <thead><tr><th>Name</th><th>Plate</th><th>Rate</th><th>Status</th><th></th></tr></thead>
        <tbody id="vehicle-table"></tbody>
      </table>
    </section>
  </div>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js"></script>
  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/validation.js"></script>
  <script src="../shared/js/routes.js"></script>
  <script src="../shared/js/domain.js"></script>
  <script src="../auth/auth.js"></script>
  <script src="../shared/js/ui.js"></script>
  <script src="./admin.js"></script>
  <script src="../shared/js/app.js"></script>
</body>
</html>
