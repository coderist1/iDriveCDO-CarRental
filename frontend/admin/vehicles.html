<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicles ?iDrive CDO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css?v=22">
</head>
<body data-page="adminVehicles" data-auth="staff" data-base="../">
  <div id="app-nav"></div>
  <div class="admin-shell">
    <div id="admin-side"></div>
    <section id="vehicle-desk">
      <div class="desk-hero">
        <div>
          <p class="eyebrow">Inventory</p>
          <h1>Vehicles</h1>
          <p>Fleet photos with repair share. Registration and service live under Fleet operations.</p>
        </div>
        <div class="desk-hero-actions" id="fleet-hero-actions"></div>
      </div>

      <div id="fleet-stats" class="fleet-stats"></div>

      <div class="fleet-list-head">
        <h2>Fleet roster</h2>
        <div class="desk-toolbar">
          <select id="fleet-filter" class="form-select">
            <option value="">All statuses</option>
            <option value="available">available</option>
            <option value="maintenance">maintenance</option>
          </select>
          <select id="fleet-type-filter" class="form-select">
            <option value="">All types</option>
            <option>Sedan</option>
            <option>SUV</option>
            <option>Van</option>
            <option>Pickup</option>
          </select>
        </div>
      </div>
      <div id="vehicle-fleet-grid" class="fleet-photo-grid"></div>

      <div id="vehicle-editor" class="fleet-editor" hidden>
        <div class="fleet-editor-head">
          <div>
            <p class="eyebrow">Editor</p>
            <h2 id="vehicle-form-title">Add vehicle</h2>
          </div>
          <button class="btn btn-ghost btn-sm" type="button" id="vehicle-form-cancel">Close</button>
        </div>
        <form id="vehicle-form" class="form-card fleet-form">
          <input type="hidden" name="vehicleId">

          <div class="fleet-form-section">
            <h3>Identity</h3>
            <div class="row g-2">
              <div class="col-md-6"><label class="field">Display name <input class="form-control" name="name" required></label></div>
              <div class="col-md-3"><label class="field">Brand <input class="form-control" name="brand" required></label></div>
              <div class="col-md-3"><label class="field">Model <input class="form-control" name="model" required></label></div>
              <div class="col-md-3"><label class="field">Plate <input class="form-control" name="plate" required></label></div>
              <div class="col-md-3"><label class="field">Status
                <select class="form-select" name="status"><option value="available">available</option><option value="maintenance">maintenance</option></select>
              </label></div>
              <div class="col-md-6"><label class="field">Image URL <input class="form-control" name="image" placeholder="https://?></label></div>
            </div>
          </div>

          <div class="fleet-form-section">
            <h3>Specs</h3>
            <div class="row g-2">
              <div class="col-md-2"><label class="field">Year model <input class="form-control" name="year" type="number"></label></div>
              <div class="col-md-2"><label class="field">Year purchased <input class="form-control" name="yearPurchased" type="number"></label></div>
              <div class="col-md-2"><label class="field">Mileage <input class="form-control" name="mileage" type="number"></label></div>
              <div class="col-md-2"><label class="field">Type
                <select class="form-select" name="type"><option>Sedan</option><option>SUV</option><option>Van</option><option>Pickup</option></select>
              </label></div>
              <div class="col-md-2"><label class="field">Transmission
                <select class="form-select" name="transmission"><option>Automatic</option><option>Manual</option></select>
              </label></div>
              <div class="col-md-2"><label class="field">Fuel
                <select class="form-select" name="fuel"><option>Gasoline</option><option>Diesel</option></select>
              </label></div>
              <div class="col-md-2"><label class="field">Capacity <input class="form-control" name="seats" type="number" min="1"></label></div>
              <div class="col-md-2"><label class="field">Luggage <input class="form-control" name="luggage" type="number" min="0"></label></div>
              <div class="col-md-2"><label class="field">Daily rate (?) <input class="form-control" name="dailyRate" type="number" required></label></div>
            </div>
          </div>

          <div class="fleet-form-section">
            <h3>Details</h3>
            <label class="field">Features (comma separated) <input class="form-control" name="features" placeholder="Bluetooth, Backup camera, USB"></label>
            <label class="field">Description <textarea class="form-control" name="description" rows="3"></textarea></label>
          </div>

          <div class="btn-row">
            <button class="btn btn-gold" type="submit">Save vehicle</button>
            <button class="btn btn-ghost" type="button" id="vehicle-form-reset">Clear form</button>
          </div>
        </form>
      </div>
    </section>
  </div>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js"></script>
  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/validation.js"></script>
  <script src="../shared/js/routes.js?v=22"></script>
  <script src="../shared/js/domain.js?v=22"></script>
  <script src="../auth/auth.js?v=22"></script>
  <script src="../shared/js/ui.js?v=23"></script>
  <script src="./admin.js?v=22"></script>
  <script src="../shared/js/app.js"></script>
</body>
</html>
