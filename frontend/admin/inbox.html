<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk inbox - iDrive CDO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css?v=20261030o">
</head>
<body data-page="adminInbox" data-auth="staff" data-base="../">
  <div id="app-nav"></div>
  <div class="admin-shell">
    <div id="admin-side"></div>
    <section>
      <div class="desk-hero">
        <div>
          <p class="eyebrow">Front desk</p>
          <h1>Inbox</h1>
          <p>Returns, incoming bookings, and customer conversations in one workspace.</p>
        </div>
      </div>
      <div class="desk-split">
        <div>
          <h2>Vehicle returns</h2>
          <p id="returns-summary" class="section-summary"></p>
          <div id="pending-returns" class="panel"></div>
        </div>
        <div>
          <h2>Incoming bookings</h2>
          <div class="section-tools">
            <p id="incoming-summary" class="section-summary"></p>
            <label class="field field-inline">Status
              <select id="incoming-filter" class="form-select">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
              </select>
            </label>
          </div>
          <div id="incoming-bookings" class="panel"></div>
        </div>
      </div>
      <div class="section-tools">
        <h2>Conversations</h2>
        <p id="thread-summary" class="section-summary"></p>
        <label class="field field-inline">Show
          <select id="thread-filter" class="form-select">
            <option value="all">All</option>
            <option value="unread">Unread</option>
          </select>
        </label>
      </div>
      <div class="inbox-layout">
        <div id="thread-list" class="panel inbox-list"></div>
        <div id="thread-view" class="panel inbox-thread">
          <p class="notice">Select a conversation to reply.</p>
        </div>
      </div>
    </section>
  </div>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js?v=20261005a"></script>
  <script src="../shared/js/store.js?v=20261008h"></script>
  <script src="../shared/js/runtime-config.js?v=20261011a"></script>
  <script src="../shared/js/api.js?v=20261009g"></script>
  <script src="../shared/js/validation.js?v=20261028e"></script>
  <script src="../shared/js/routes.js?v=20261019a"></script>
  <script src="../shared/js/domain.js?v=20261030i"></script>
  <script src="../auth/auth.js?v=20261024a"></script>
  <script src="../shared/js/ui.js?v=20261030a"></script>
  <script src="./admin.js?v=20261030f"></script>
  <script src="../shared/js/app.js?v=20261030a"></script>
</body>
</html>
