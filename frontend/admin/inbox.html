<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk inbox — iDrive CDO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css?v=10">
</head>
<body data-page="adminInbox" data-auth="staff" data-base="../">
  <div id="app-nav"></div>
  <div class="admin-shell">
    <div id="admin-side"></div>
    <section>
      <p class="eyebrow">Front desk</p>
      <h1>Inbox</h1>
      <p>New bookings, vehicle returns, and customer messages land here. Reply so the customer sees it on their account.</p>
      <h2>Vehicle returns</h2>
      <div id="pending-returns" class="panel"></div>
      <h2>Incoming bookings</h2>
      <div id="incoming-bookings" class="panel"></div>
      <h2>Conversations</h2>
      <div class="inbox-layout">
        <div id="thread-list" class="panel inbox-list"></div>
        <div id="thread-view" class="panel inbox-thread">
          <p class="notice">Select a conversation to reply.</p>
        </div>
      </div>
    </section>
  </div>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js"></script>
  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/validation.js"></script>
  <script src="../shared/js/routes.js?v=8"></script>
  <script src="../shared/js/domain.js?v=8"></script>
  <script src="../auth/auth.js"></script>
  <script src="../shared/js/ui.js?v=8"></script>
  <script src="./admin.js?v=8"></script>
  <script src="../shared/js/app.js"></script>
</body>
</html>
