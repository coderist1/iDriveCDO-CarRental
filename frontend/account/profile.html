<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — iDrive CDO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css">
</head>
<body data-page="profile" data-auth="user" data-base="../">
  <div id="app-nav"></div>
  <section class="layout">
    <form id="profile-form" class="form-card">
      <p class="eyebrow">License file</p>
      <h1>Profile</h1>
      <p>Email <strong id="profile-email"></strong> cannot be changed.</p>

      <div class="profile-photo-block">
        <div id="profile-avatar" class="avatar avatar-lg avatar-fallback">?</div>
        <div class="profile-photo-actions">
          <label class="btn btn-ghost btn-sm profile-upload-label">
            Upload photo
            <input id="avatar-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          </label>
          <button class="btn btn-ghost btn-sm" id="avatar-remove" type="button">Remove</button>
          <p class="fineprint">JPG, PNG, or WebP · under 5 MB · cropped square preview</p>
        </div>
      </div>

      <div class="row g-2">
        <div class="col-md-6"><label class="field">First name <input class="form-control" name="firstName" required></label></div>
        <div class="col-md-6"><label class="field">Last name <input class="form-control" name="lastName" required></label></div>
      </div>
      <label class="field">Mobile <input class="form-control" name="phone" required></label>
      <label class="field">License no. <input class="form-control" name="licenseNo" required></label>
      <label class="field">License expiry <input class="form-control" name="licenseExpiry" type="date" required></label>
      <button class="btn btn-gold" type="submit">Save profile</button>
    </form>
    <form id="password-form" class="form-card">
      <h2>Change password</h2>
      <label class="field">Current password <input class="form-control" name="currentPassword" type="password" required></label>
      <label class="field">New password <input class="form-control" name="nextPassword" type="password" required></label>
      <label class="field">Confirm new password <input class="form-control" name="confirmPassword" type="password" required></label>
      <button class="btn btn-dark" type="submit">Update password</button>
    </form>
  </section>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js"></script>
  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/validation.js"></script>
  <script src="../shared/js/routes.js"></script>
  <script src="../shared/js/domain.js"></script>
  <script src="../auth/auth.js"></script>
  <script src="../shared/js/ui.js"></script>
  <script src="./account.js"></script>
  <script src="../shared/js/app.js"></script>
</body>
</html>
