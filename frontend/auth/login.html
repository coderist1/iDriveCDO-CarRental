<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - iDrive CDO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css?v=20261113e">
</head>
<body data-page="login" data-auth="public" data-base="../">
  <div id="app-nav"></div>
  <section class="layout layout-narrow">
    <form id="login-form" class="form-card" novalidate>
      <p class="eyebrow">Account</p>
      <h1>Sign in</h1>
      <div id="form-alert" class="notice" hidden></div>
      <label class="field">Email <input class="form-control" name="email" type="email" autocomplete="username" required></label>
      <label class="field">Password <input class="form-control" name="password" type="password" autocomplete="current-password" required></label>
      <p class="forgot-row"><a href="./forgot.html">Forgot password?</a></p>
      <div class="auth-actions">
        <div class="google-signin-slot">
          <button type="button" class="btn google-custom" tabindex="-1" aria-hidden="true"><svg class="google-g" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg><span class="google-label">Google</span></button>
          <div id="google-signin" class="google-signin" aria-live="polite"></div>
        </div>
        <button class="btn btn-gold" type="submit">Sign in</button>
      </div>
      <p class="form-foot">New guest? <a href="./register.html">Create an account</a></p>
    </form>
  </section>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js?v=20261114a"></script>
  <script src="../shared/js/store.js?v=20261008h"></script>
  <script src="../shared/js/runtime-config.js?v=20261011a"></script>
  <script src="../shared/js/api.js?v=20261114a"></script>
  <script src="../shared/js/validation.js?v=20261028e"></script>
  <script src="../shared/js/routes.js?v=20261019a"></script>
  <script src="../shared/js/domain.js?v=20261114a"></script>
  <script src="../auth/auth.js?v=20261119d"></script>
  <script src="../shared/js/ui.js?v=20261114a"></script>
  <script src="./auth-pages.js?v=20261114a"></script>
  <script src="../shared/js/app.js?v=20261119i"></script>
</body>
</html>
