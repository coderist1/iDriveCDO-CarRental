<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - iDrive CDO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css?v=20261010g">
</head>
<body data-page="login" data-auth="public" data-base="../">
  <div id="app-nav"></div>
  <section class="layout layout-narrow">
    <form id="login-form" class="form-card" novalidate>
      <p class="eyebrow">Account</p>
      <h1>Sign in</h1>
      <div id="form-alert" class="notice" hidden></div>
      <label class="field">Email <input class="form-control" name="email" type="email" autocomplete="username" required></label>
      <label class="field">Password <input class="form-control" name="password" type="password" autocomplete="current-password" required></label>
      <div class="auth-actions">
        <div id="google-signin" class="google-signin" aria-live="polite"></div>
        <button class="btn btn-gold" type="submit">Sign in</button>
      </div>
      <p class="form-foot">New guest? <a href="./register.html">Create an account</a></p>
    </form>
  </section>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js?v=20261005a"></script>
  <script src="../shared/js/store.js?v=20261008h"></script>
  <script src="../shared/js/api.js?v=20261009g"></script>
  <script src="../shared/js/validation.js?v=20261005a"></script>
  <script src="../shared/js/routes.js?v=20261005a"></script>
  <script src="../shared/js/domain.js?v=20261010h"></script>
  <script src="../auth/auth.js?v=20261010a"></script>
  <script src="../shared/js/ui.js?v=20261010b"></script>
  <script src="./auth-pages.js?v=20261009m"></script>
  <script src="../shared/js/app.js?v=20261008h"></script>
</body>
</html>
