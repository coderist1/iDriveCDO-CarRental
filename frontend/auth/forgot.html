<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password - iDrive CDO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/styles.css?v=20261010q">
</head>
<body data-page="forgot" data-auth="public" data-base="../">
  <div id="app-nav"></div>
  <section class="layout layout-narrow">
    <form id="forgot-form" class="form-card" novalidate>
      <p class="eyebrow">Account</p>
      <h1>Forgot password</h1>
      <p class="fineprint">Enter the email and mobile number on the account, then choose a new password.</p>
      <div id="form-alert" class="notice" hidden></div>
      <label class="field">Email <input class="form-control" name="email" type="email" autocomplete="username" required></label>
      <label class="field">Mobile <input class="form-control" name="phone" placeholder="09171234567" inputmode="tel" autocomplete="tel" required></label>
      <label class="field">New password <input class="form-control" name="password" type="password" autocomplete="new-password" required></label>
      <label class="field">Confirm new password <input class="form-control" name="confirmPassword" type="password" autocomplete="new-password" required></label>
      <p class="fineprint">8+ characters with an uppercase letter, a lowercase letter, a number, and a symbol.</p>
      <button class="btn btn-gold" type="submit">Reset password</button>
      <p class="form-foot"><a href="./login.html">Back to sign in</a></p>
    </form>
  </section>
  <div id="app-footer"></div>
  <div id="toast-host"></div>
  <script src="../shared/js/security.js?v=20261005a"></script>
  <script src="../shared/js/store.js?v=20261008h"></script>
  <script src="../shared/js/api.js?v=20261009g"></script>
  <script src="../shared/js/validation.js?v=20261005a"></script>
  <script src="../shared/js/routes.js?v=20261010m"></script>
  <script src="../shared/js/domain.js?v=20261010k"></script>
  <script src="../auth/auth.js?v=20261010m"></script>
  <script src="../shared/js/ui.js?v=20261010p"></script>
  <script src="./auth-pages.js?v=20261010m"></script>
  <script src="../shared/js/app.js?v=20261010k"></script>
</body>
</html>
